<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyprControl</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">hyprcontrol</span>
    </div>
    <div class="nav-list">
      <div class="nav-item active" data-panel="wifi">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
        Wi-Fi
      </div>
      <div class="nav-item" data-panel="bluetooth">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/></svg>
        Bluetooth
      </div>
      <div class="nav-item" data-panel="wallpaper">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Wallpaper
      </div>
      <div class="nav-item" data-panel="appearance">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        Appearance
      </div>
      <div class="nav-item" data-panel="display">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Display
      </div>
      <div class="nav-item" data-panel="audio">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        Audio
      </div>
      <div class="nav-item" data-panel="power">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
        Power
      </div>
      <div class="nav-item" data-panel="keyboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="10" x2="6" y2="10"/><line x1="10" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="14" y2="10"/><line x1="18" y1="10" x2="18" y2="10"/><line x1="6" y1="14" x2="18" y2="14"/></svg>
        Keyboard
      </div>
      <div class="nav-item" data-panel="hyprland">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        Hyprland
      </div>
    </div>
    <div class="sidebar-footer">v2.0.0</div>
  </nav>

  <!-- Content -->
  <main class="content">
    <div id="panel-wifi"       class="panel active"></div>
    <div id="panel-bluetooth"  class="panel"></div>
    <div id="panel-wallpaper"  class="panel"></div>
    <div id="panel-appearance" class="panel"></div>
    <div id="panel-display"    class="panel"></div>
    <div id="panel-audio"      class="panel"></div>
    <div id="panel-power"      class="panel"></div>
    <div id="panel-keyboard"   class="panel"></div>
    <div id="panel-hyprland"   class="panel"></div>
  </main>

</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/panels/wifi.js"></script>
<script src="/js/panels/bluetooth.js"></script>
<script src="/js/panels/wallpaper.js"></script>
<script src="/js/panels/appearance.js"></script>
<script src="/js/panels/display.js"></script>
<script src="/js/panels/audio.js"></script>
<script src="/js/panels/power.js"></script>
<script src="/js/panels/keyboard.js"></script>
<script src="/js/panels/hyprland.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
